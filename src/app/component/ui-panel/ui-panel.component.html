<div [@flyInOut]="'in'" [ngClass]="{'pointer-events-none': isPointerDragging}" class="draggable-panel"
  [style.left.px]="left" [style.top.px]="top" [style.width.px]="width" [style.height.px]="height"
  [draggable.stack]="'.draggable-panel'" [resizable.stack]="'.draggable-panel'" appDraggable appResizable #draggablePanel>
  <div class="title">
    <div class="title-text">{{panelService.title}}</div>
    <div class="title-button" *ngIf="showTitleButtons">
      <button type="button" title="全画面表示を切り替える" aria-label="全画面表示を切り替える" (click)="toggleFullScreen()">
        <i class="material-icons" aria-hidden="true" style="font-size: 14px;">fullscreen</i>
      </button>
      <button type="button" title="閉じる" aria-label="パネルを閉じる" (click)="close()">
        <i class="material-icons" aria-hidden="true" style="font-size: 14px;">close</i>
      </button>
    </div>
  </div>
  <div class="scrollable-panel" #scrollablePanel>
    <ng-content></ng-content>
    <div #content></div>
  </div>
</div>
